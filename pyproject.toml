[project]
name = "buckler"
version = "0.20.0"
description = "Buckler — ADB CLI for NVIDIA SHIELD TV Pro cleanup, privacy profiles, and custom HOME launcher."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["android-tv", "nvidia-shield", "adb", "launcher", "privacy"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/asafelobotomy/buckler"
Releases = "https://github.com/asafelobotomy/buckler/releases"

[project.scripts]
buckler = "buckler.cli:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
buckler = ["py.typed", "data/*/*.yaml", "data/*/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
