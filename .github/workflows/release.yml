name: release

# Publishes a GitHub release whenever main carries a version with no tag yet: bump the version in
# pyproject.toml, src/buckler/__init__.py and launcher/app/build.gradle.kts (they must match), push,
# and once ci passes for that commit this tags v<version> and uploads buckler-home.apk, its .sha256
# and the CLI wheel (scripts/release.py). A red ci never releases.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only after a green ci on a push to main (or by hand).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: New version?
        id: version
        run: |
          # Release exactly what ci tested: if main has moved on, that newer commit's own run decides.
          tested="${{ github.event.workflow_run.head_sha }}"
          if [ -n "$tested" ] && [ "$(git rev-parse HEAD)" != "$tested" ]; then
            echo "main moved on from $tested; its own ci run will release."
            echo "new=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release key
        if: steps.version.outputs.new == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.BUCKLER_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BUCKLER_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The BUCKLER_KEYSTORE_B64 and BUCKLER_KEYSTORE_PASSWORD secrets are missing (README → Releasing)."
            exit 1
          fi
          umask 077
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=buckler"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > launcher/keystore.properties

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: steps.version.outputs.new == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: steps.version.outputs.new == 'true'

      - name: Android SDK (preinstalled on the runner)
        if: steps.version.outputs.new == 'true'
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: steps.version.outputs.new == 'true'

      - name: Build, check the signer and publish
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py --publish

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" launcher/keystore.properties
