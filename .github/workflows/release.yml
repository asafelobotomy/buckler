name: release

# Publishes a GitHub release whenever main carries a version with no tag yet: bump the version in
# pyproject.toml and launcher/app/build.gradle.kts (they must match), push, and this tags
# v<version> and uploads buckler-home.apk, its .sha256 and the CLI wheel (scripts/release.py).
on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - launcher/app/build.gradle.kts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: New version?
        id: version
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "v$v is already released; nothing to do."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Release key
        if: steps.version.outputs.new == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.BUCKLER_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BUCKLER_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::The BUCKLER_KEYSTORE_B64 and BUCKLER_KEYSTORE_PASSWORD secrets are missing (README → Releasing)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          umask 077
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=buckler"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > launcher/keystore.properties

      - uses: actions/setup-java@v4
        if: steps.version.outputs.new == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: steps.version.outputs.new == 'true'

      - name: Build tools (apksigner)
        if: steps.version.outputs.new == 'true'
        run: sdkmanager "build-tools;36.0.0"

      - uses: astral-sh/setup-uv@v5
        if: steps.version.outputs.new == 'true'

      - name: Build, check the signer and publish
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release.py --publish

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" launcher/keystore.properties
