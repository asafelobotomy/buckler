name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
      - name: Install (from uv.lock)
        run: uv sync --locked --extra dev
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Pytest
        run: uv run pytest -q
      - name: File length limit (400 lines)
        run: uv run python scripts/check_loc.py

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # Caches Gradle and its dependencies, and checks the wrapper jar.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Android SDK (preinstalled on the runner)
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Unit tests and lint
        working-directory: launcher
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug
      - name: Assemble release
        working-directory: launcher
        run: ./gradlew :app:assembleRelease
