name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check src tests scripts
      - name: Pytest
        run: pytest -q
      - name: File length limit (400 lines)
        run: python scripts/check_loc.py

  launcher:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK (preinstalled on the runner)
        run: |
          sdkmanager=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null
      - name: Unit tests
        working-directory: launcher
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Assemble release
        working-directory: launcher
        run: ./gradlew :app:assembleRelease --no-daemon
